# Changesets-driven release: push to main opens/refreshes a "version packages"
# PR; merging it publishes the bumped packages to npm.
#
# npm auth is OIDC trusted publishing, pinned on npmjs.org to this workflow
# path. Do NOT rename publish.yaml — renaming breaks publishing until the
# trusted-publisher entry is updated.
name: Release & Publish

on:
  push:
    branches: [main]
  workflow_dispatch: # manual re-trigger if a Version-PR merge push needs re-running
  # Preview releases are opt-in via the `release-preview` PR label.
  pull_request:
    types: [labeled]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    # Main release chain runs on push only, not the preview label event.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: ./.github/workflows/checks.yaml

  changesets:
    name: Version
    needs: verify
    # Prevent this job from running on forks.
    if: github.repository == 'lifinance/perps-sdk'
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Create version PR
        id: changesets
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm changeset:version
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Release
    needs: changesets
    if: needs.changesets.outputs.hasChangesets == 'false'
    permissions:
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      - name: Publish to npm
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          publish: pnpm changeset:publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  # Preview release (opt-in): the `release-preview` label publishes a throwaway
  # 0.0.0-preview-<sha> to the `preview` dist-tag. Gated by same-repo (forks can't
  # trigger); a 0.0.0-preview can never become latest.
  # NEVER convert this to pull_request_target.
  preview:
    name: Preview release (PR)
    if: >-
      github.event_name == 'pull_request'
      && github.event.label.name == 'release-preview'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publishing + provenance
      pull-requests: write # post the install comment + remove the label
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Install dependencies
        uses: ./.github/actions/pnpm-install
      # Composite (not a reusable workflow) so npm OIDC stays bound to publish.yaml.
      - name: Publish preview
        uses: ./.github/actions/preview-publish
