name: Manual Unpublish

# Manually unpublish a version of @lifi/perps-types from npm. Human-only:
# triggered from the GitHub Actions UI (Actions tab → "Manual Unpublish" → "Run
# workflow"). Used to roll back accidental publishes (e.g. an automated agent
# pushing a release-pattern tag that triggered the publish workflow).
#
# Constraints:
#   - npm only allows unpublish within 72 hours of the publish event.
#   - Once unpublished, the version number is permanently retired — the next
#     publish must use a higher version number. Skipped numbers are fine.
#   - If the unpublished version is the current `dist-tag` target, the tag is
#     left orphaned. Use the optional `rollback_dist_tag_to` input to repoint
#     it to a previously published valid version (e.g. 0.1.1-alpha.21).
#
# Auth: OIDC trusted publisher — same mechanism as publish.yaml. No npm token
# secret is needed; the workflow's GitHub identity is the credential.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to unpublish (e.g. 0.1.1-alpha.23). Must already exist on npm.'
        required: true
        type: string
      rollback_dist_tag_to:
        description: 'Optional: version to repoint the alpha dist-tag to after unpublish (e.g. 0.1.1-alpha.21). Leave blank to skip.'
        required: false
        type: string
      dist_tag:
        description: 'dist-tag to repoint (only used if rollback_dist_tag_to is set). Default: alpha.'
        required: false
        type: string
        default: 'alpha'

jobs:
  unpublish:
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Show pre-state
        run: |
          echo "Current dist-tags:"
          npm view @lifi/perps-types dist-tags
          echo
          echo "Version exists?"
          npm view "@lifi/perps-types@${{ inputs.version }}" version 2>&1 || true

      - name: Unpublish ${{ inputs.version }}
        run: |
          npm unpublish "@lifi/perps-types@${{ inputs.version }}"
        env:
          NPM_CONFIG_PROVENANCE: true

      - name: Rollback dist-tag (optional)
        if: inputs.rollback_dist_tag_to != ''
        run: |
          echo "Repointing dist-tag '${{ inputs.dist_tag }}' to ${{ inputs.rollback_dist_tag_to }}"
          npm dist-tag add "@lifi/perps-types@${{ inputs.rollback_dist_tag_to }}" "${{ inputs.dist_tag }}"

      - name: Show post-state
        run: |
          echo "Current dist-tags:"
          npm view @lifi/perps-types dist-tags
          echo
          echo "Version still listed?"
          npm view "@lifi/perps-types@${{ inputs.version }}" version 2>&1 || echo "  (not found — unpublish succeeded)"

      - name: Delete matching git tag
        run: |
          TAG="v${{ inputs.version }}"
          if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
            git push origin ":refs/tags/$TAG" 2>&1 || echo "  (tag not on origin, skipping remote delete)"
            git tag -d "$TAG" 2>&1 || true
            echo "Deleted tag $TAG locally and on origin (if it existed)."
          else
            echo "Tag $TAG not found locally — fetching from origin to check."
            git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>&1 || echo "  (tag not on origin either, nothing to delete)"
            if git rev-parse --quiet --verify "refs/tags/$TAG" >/dev/null; then
              git push origin ":refs/tags/$TAG" || true
              git tag -d "$TAG" || true
              echo "Deleted tag $TAG."
            fi
          fi

      - name: Delete matching GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ inputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes
            echo "Deleted GitHub release $TAG."
          else
            echo "No GitHub release $TAG to delete."
          fi
